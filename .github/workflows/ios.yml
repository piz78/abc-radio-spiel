name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fragen-Datenbank prüfen
        run: python3 tools/validate_questions.py

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Core-Logik testen (swift test)
        run: swift test

      - name: Clip-Manifest erzeugen (swift run abc-clips)
        run: |
          swift build -c release --product abc-clips
          "$(swift build -c release --show-bin-path)/abc-clips" ABCSpiel/Resources/fragen.txt > "$RUNNER_TEMP/clips.json"
          python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print(len(c), 'Clips'); assert len(c) > 600" "$RUNNER_TEMP/clips.json"

      - name: Stimm-Generator testen (Attrappe, ohne Modell)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy soundfile
          "$RUNNER_TEMP/venv/bin/python" tools/voice/generate_clips.py --engine dummy \
            --manifest "$RUNNER_TEMP/clips.json" --ausgabe "$RUNNER_TEMP/clips" --nur-fragen --buchstabe A --limit 8
          "$RUNNER_TEMP/venv/bin/python" tools/voice/generate_clips.py --engine say \
            --manifest "$RUNNER_TEMP/clips.json" --ausgabe "$RUNNER_TEMP/clips" --keys q-b-bern,greeting-2 || true
          ls -la "$RUNNER_TEMP/clips"
          test "$(ls "$RUNNER_TEMP/clips"/*.m4a | wc -l)" -ge 8
          afinfo "$RUNNER_TEMP/clips/q-a-aare.m4a" | grep -E "duration|Data format"

      - name: App für den iOS-Simulator bauen
        run: |
          xcodebuild \
            -project ABCSpiel.xcodeproj \
            -scheme ABCSpiel \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
